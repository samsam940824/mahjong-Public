<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>玩家管理 - 麻將戰績</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="utils.js"></script>
    <script src="auth.js"></script>

    <header>
        <a href="./index.html">🀄 麻將戰績紀錄</a>
    </header>
    <nav class="nav-links">
        <a href="./index.html"        data-page="index.html">首頁</a>
        <a href="./session_new.html"  data-page="session_new.html">記一場</a>
        <a href="./players.html"      data-page="players.html">玩家</a>
        <a href="./query.html"        data-page="query.html">查詢</a>
        <a href="./achievements.html" data-page="achievements.html">成就</a>
        <a href="./export.html"       data-page="export.html">匯出</a>
        <a href="#" class="nav-logout" onclick="logout(); return false;">登出</a>
    </nav>

    <div class="container">
        <div id="msgAlert" class="alert"></div>

        <div class="card">
            <h3>新增玩家</h3>
            <form id="createForm" onsubmit="createPlayer(event)">
                <div class="form-group">
                    <label>名稱</label>
                    <input type="text" id="createName" placeholder="輸入名字 (例如: 三叔公)" required>
                </div>
                <div class="form-group">
                    <label>類型</label>
                    <select id="createType">
                        <option value="fixed">固定玩家 (家人)</option>
                        <option value="guest">訪客 (偶爾來)</option>
                    </select>
                </div>
                <button type="submit" id="createBtn" class="btn btn-primary btn-block">新增</button>
            </form>
        </div>

        <div class="card">
            <h3>玩家列表</h3>
            <table>
                <thead>
                    <tr>
                        <th>名稱</th>
                        <th>類型</th>
                        <th class="text-right">操作</th>
                    </tr>
                </thead>
                <tbody id="playersTableBody">
                    <tr><td colspan="3" class="text-center" style="padding:20px;">載入中...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <h3>編輯玩家</h3>
            <form id="editForm" onsubmit="updatePlayer(event)">
                <input type="hidden" id="editId">
                <div class="form-group">
                    <label>名稱</label>
                    <input type="text" id="editName" required>
                </div>
                <div class="form-group">
                    <label>類型</label>
                    <select id="editType">
                        <option value="fixed">固定玩家 (家人)</option>
                        <option value="guest">訪客 (偶爾來)</option>
                    </select>
                </div>
                <div style="display:flex; gap:10px;">
                    <button type="submit" id="editSaveBtn" class="btn btn-primary btn-block">儲存</button>
                    <button type="button" class="btn btn-secondary btn-block" onclick="closeEditModal()">取消</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        async function loadPlayers() {
            try {
                const { data: players, error } = await window.sb.from('players').select('*').order('name');
                if (error) throw error;

                const tbody = document.getElementById('playersTableBody');
                tbody.innerHTML = '';

                if (!players || players.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3" class="text-center" style="padding:20px; color:#888;">目前沒有玩家</td></tr>';
                    return;
                }

                players.forEach(player => {
                    const tr = document.createElement('tr');

                    const tdName = document.createElement('td');
                    tdName.textContent = player.name;

                    const tdType = document.createElement('td');
                    tdType.innerHTML = player.type === 'fixed'
                        ? '<span style="color:#2980b9;">固定</span>'
                        : '<span style="color:#e67e22;">訪客</span>';

                    const tdActions = document.createElement('td');
                    tdActions.className = 'text-right';
                    tdActions.style.whiteSpace = 'nowrap';

                    const editBtn = document.createElement('button');
                    editBtn.className = 'btn btn-secondary';
                    editBtn.style.cssText = 'padding:5px 10px; font-size:0.8rem; margin-right:5px;';
                    editBtn.textContent = '編輯';
                    editBtn.onclick = () => openEditModal(player.id, player.name, player.type);

                    const toggleBtn = document.createElement('button');
                    toggleBtn.style.cssText = 'padding:5px 10px; font-size:0.8rem; margin-right:5px;';
                    toggleBtn.className = player.active ? 'btn btn-danger' : 'btn btn-success';
                    toggleBtn.textContent = player.active ? '停用' : '啟用';
                    toggleBtn.onclick = () => togglePlayer(player.id, !player.active);

                    const delBtn = document.createElement('button');
                    delBtn.className = 'btn btn-dark';
                    delBtn.style.cssText = 'padding:5px 10px; font-size:0.8rem;';
                    delBtn.textContent = '🗑️';
                    delBtn.onclick = () => {
                        if (confirm('確定要刪除嗎？若有戰績將無法刪除。')) deletePlayer(player.id);
                    };

                    tdActions.append(editBtn, toggleBtn, delBtn);
                    tr.append(tdName, tdType, tdActions);
                    tbody.appendChild(tr);
                });
            } catch (e) {
                console.error(e);
                showMessage("載入失敗: " + e.message);
            }
        }

        async function createPlayer(e) {
            e.preventDefault();
            const name = document.getElementById('createName').value;
            const type = document.getElementById('createType').value;
            const btn  = document.getElementById('createBtn');
            btn.disabled = true;

            try {
                const { error } = await window.sb.from('players').insert([{ name, type, active: true }]);
                if (error) {
                    showMessage(error.code === '23505' ? "新增失敗: 玩家名稱已存在" : "新增失敗: " + error.message);
                } else {
                    document.getElementById('createForm').reset();
                    loadPlayers();
                }
            } catch (e) {
                showMessage("新增失敗: " + e.message);
            } finally {
                btn.disabled = false;
            }
        }

        function openEditModal(id, name, type) {
            document.getElementById('editId').value   = id;
            document.getElementById('editName').value = name;
            document.getElementById('editType').value = type;
            document.getElementById('editModal').style.display = 'flex';
        }

        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
        }

        async function updatePlayer(e) {
            e.preventDefault();
            const id   = document.getElementById('editId').value;
            const name = document.getElementById('editName').value;
            const type = document.getElementById('editType').value;
            const btn  = document.getElementById('editSaveBtn');
            btn.disabled = true;

            try {
                const { error } = await window.sb.from('players').update({ name, type }).eq('id', id);
                if (error) {
                    showMessage(error.code === '23505' ? "更新失敗: 玩家名稱已存在" : "更新失敗: " + error.message);
                } else {
                    closeEditModal();
                    loadPlayers();
                }
            } catch (e) {
                showMessage("更新失敗: " + e.message);
            } finally {
                btn.disabled = false;
            }
        }

        async function togglePlayer(id, targetActive) {
            try {
                const { error } = await window.sb.from('players').update({ active: targetActive }).eq('id', id);
                if (error) throw error;
                loadPlayers();
            } catch (e) {
                showMessage("切換失敗: " + e.message);
            }
        }

        async function deletePlayer(id) {
            try {
                const { error } = await window.sb.from('players').delete().eq('id', id);
                if (error) {
                    showMessage(error.code === '23503' ? "無法刪除：該玩家已有戰績或成就" : "刪除失敗: " + error.message);
                } else {
                    loadPlayers();
                }
            } catch (e) {
                showMessage("刪除失敗: " + e.message);
            }
        }

        document.addEventListener('DOMContentLoaded', loadPlayers);
    </script>
</body>

</html>
