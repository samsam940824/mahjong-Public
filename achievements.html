<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#6366f1">
    <link rel="manifest" href="./manifest.json">
    <title>個人成就 - 麻將戰績</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>

<body>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="config.js"></script>
    <script src="utils.js"></script>
    <script src="auth.js"></script>

    <header>
        <a href="./index.html">🀄 麻將戰績紀錄</a>
    </header>
    <nav class="nav-links" aria-label="主導覽">
        <a href="./index.html"        data-page="index.html">首頁</a>
        <a href="./session_new.html"  data-page="session_new.html">記一場</a>
        <a href="./players.html"      data-page="players.html">玩家</a>
        <a href="./query.html"        data-page="query.html">查詢</a>
        <a href="./stats.html"        data-page="stats.html">📊 數據</a>
        <a href="./achievements.html" data-page="achievements.html">成就</a>
        <a href="./export.html"       data-page="export.html">匯出</a>
        <a href="#" class="nav-logout" onclick="logout(); return false;">登出</a>
    </nav>

    <div class="container">
        <div class="card">
            <h3>
                🌟 新增 / 編輯成就
                <span id="formStatusBadge" class="badge badge-new">新增模式</span>
            </h3>

            <form id="achievementForm" onsubmit="submitAchievement(event)">
                <input type="hidden" id="ach_id" value="">

                <div class="form-group">
                    <label for="ach_date">📅 達成日期（有成就的日期顯示藍點）</label>
                    <input type="text" id="ach_date" placeholder="選擇日期..." required readonly>
                </div>

                <div class="form-group">
                    <label for="ach_name">🏆 成就名稱 (必填)</label>
                    <input type="text" id="ach_name" required placeholder="例如：自摸天胡、單場最高分...">
                </div>

                <div class="form-group">
                    <label for="ach_player">👤 達成玩家 (必填)</label>
                    <select id="ach_player" required>
                        <option value="">-- 請選擇玩家 --</option>
                        <optgroup id="active-players-group"   label="啟用的玩家"></optgroup>
                        <optgroup id="inactive-players-group" label="停用的玩家"></optgroup>
                    </select>
                </div>

                <div class="form-group">
                    <label for="ach_session">🔗 關聯場次 (選填)</label>
                    <select id="ach_session">
                        <option value="0">-- 無關聯場次 --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="ach_note">📝 備註事項 (選填)</label>
                    <input type="text" id="ach_note" placeholder="例如：手牌很旺...">
                </div>

                <button type="submit" id="submitBtn" class="btn btn-success btn-block">🚀 儲存成就</button>
                <button type="button" id="cancelEditBtn" class="btn btn-warning btn-block"
                    style="display:none; margin-top:10px;" onclick="resetForm()">取消編輯</button>
            </form>
        </div>

        <div class="card">
            <h3>📜 歷史成就列表</h3>
            <table>
                <thead>
                    <tr>
                        <th>日期</th>
                        <th>成就名稱</th>
                        <th>玩家</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="achievementsTableBody">
                    <tr><td colspan="4"><div class="skeleton" style="height:60px;"></div></td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let playersData = [];
        let sessionsData = [];

        function fireConfetti() {
            const colors = ['#6366f1', '#ec4899', '#f59e0b', '#22c55e', '#06b6d4', '#a855f7'];
            const count = 70;
            for (let i = 0; i < count; i++) {
                const p = document.createElement('div');
                p.className = 'confetti-piece';
                p.style.left = Math.random() * 100 + 'vw';
                p.style.background = colors[i % colors.length];
                p.style.animationDelay = (Math.random() * 0.3) + 's';
                p.style.animationDuration = (1.8 + Math.random() * 1.2) + 's';
                p.style.transform = `rotate(${Math.random() * 360}deg)`;
                document.body.appendChild(p);
                setTimeout(() => p.remove(), 3500);
            }
        }

        function resetForm() {
            document.getElementById('ach_id').value = '';
            setCalendarDate(new Date().toISOString().split('T')[0]);
            document.getElementById('ach_name').value    = '';
            document.getElementById('ach_player').value  = '';
            document.getElementById('ach_session').value = '0';
            document.getElementById('ach_note').value    = '';

            const badge = document.getElementById('formStatusBadge');
            badge.className   = 'badge badge-new';
            badge.textContent = '新增模式';

            const btn = document.getElementById('submitBtn');
            btn.textContent = '🚀 新增成就';
            btn.className   = 'btn btn-success btn-block';

            document.getElementById('cancelEditBtn').style.display = 'none';
        }

        async function loadData() {
            try {
                const [{ data: players, error: pErr }, { data: sessions, error: sErr }, { data: achievements, error: aErr }] = await Promise.all([
                    window.sb.from('players').select('*'),
                    window.sb.from('sessions').select('*').order('date', { ascending: false }),
                    window.sb.from('achievements').select('*, players(name), sessions(date)')
                ]);
                if (pErr) throw pErr;
                if (sErr) throw sErr;
                if (aErr) throw aErr;

                playersData  = players;
                sessionsData = sessions;

                const activeGroup   = document.getElementById('active-players-group');
                const inactiveGroup = document.getElementById('inactive-players-group');
                activeGroup.innerHTML = inactiveGroup.innerHTML = '';
                playersData.forEach(p => {
                    const opt = document.createElement('option');
                    opt.value = p.id;
                    opt.textContent = escapeHTML(p.name);
                    (p.active ? activeGroup : inactiveGroup).appendChild(opt);
                });

                const sessionSelect = document.getElementById('ach_session');
                sessionSelect.innerHTML = '<option value="0">-- 無關聯場次 --</option>';
                sessionsData.forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s.id;
                    opt.textContent = s.date;
                    sessionSelect.appendChild(opt);
                });

                const formatted = achievements.map(a => ({
                    id: a.id, date: a.date, name: a.name, note: a.note,
                    player_id: a.player_id,
                    player_name: a.players ? a.players.name : '未知',
                    session_id: a.session_id,
                    session_date: a.sessions ? a.sessions.date : null
                })).sort((a, b) => b.date.localeCompare(a.date));
                renderTable(formatted);

                if (!document.getElementById('ach_id').value) {
                    document.getElementById('ach_date').value = new Date().toISOString().split('T')[0];
                }
            } catch (e) {
                console.error(e);
                toast("載入失敗：" + e.message, 'error');
            }
        }

        function renderTable(achievements) {
            const tbody = document.getElementById('achievementsTableBody');
            if (achievements.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="empty-state">目前沒有成就紀錄。</td></tr>';
                return;
            }
            tbody.innerHTML = '';
            achievements.forEach(a => {
                const tr = document.createElement('tr');
                let nameHtml = `<strong>🌟 ${escapeHTML(a.name)}</strong>`;
                if (a.note) nameHtml += `<br><span class="text-muted">${escapeHTML(a.note)}</span>`;
                if (a.session_id) nameHtml += ` <a href="query.html?tab=session&date=${a.date}" style="font-size:.8em; color:var(--c-primary-d); text-decoration:none;">[查看場次]</a>`;

                tr.innerHTML = `
                    <td>${escapeHTML(a.date)}</td>
                    <td>${nameHtml}</td>
                    <td>${escapeHTML(a.player_name)}</td>
                    <td style="white-space:nowrap;">
                        <button class="btn btn-warning" style="padding:6px 12px; font-size:.85rem; margin-right:5px;" data-action="edit">編輯</button>
                        <button class="btn btn-danger"  style="padding:6px 12px; font-size:.85rem;" data-action="delete" aria-label="刪除 ${escapeHTML(a.name)}">刪除</button>
                    </td>
                `;
                tr.querySelector('[data-action="edit"]').addEventListener('click',   () => editAchievement(a));
                tr.querySelector('[data-action="delete"]').addEventListener('click', () => deleteAchievement(a.id, a.name));
                tbody.appendChild(tr);
            });
        }

        function editAchievement(a) {
            document.getElementById('ach_id').value = a.id;
            setCalendarDate(a.date);
            document.getElementById('ach_name').value    = a.name;
            document.getElementById('ach_player').value  = a.player_id;
            document.getElementById('ach_session').value = a.session_id || '0';
            document.getElementById('ach_note').value    = a.note || '';

            const badge = document.getElementById('formStatusBadge');
            badge.className   = 'badge badge-update';
            badge.textContent = '編輯模式';

            const btn = document.getElementById('submitBtn');
            btn.textContent = '🔄 更新成就';
            btn.className   = 'btn btn-warning btn-block';

            document.getElementById('cancelEditBtn').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function submitAchievement(e) {
            e.preventDefault();
            const payload = {
                date:       document.getElementById('ach_date').value,
                name:       document.getElementById('ach_name').value,
                player_id:  parseInt(document.getElementById('ach_player').value),
                session_id: parseInt(document.getElementById('ach_session').value) || null,
                note:       document.getElementById('ach_note').value || null
            };
            const editId = document.getElementById('ach_id').value;
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;

            try {
                let error;
                if (editId) {
                    ({ error } = await window.sb.from('achievements').update(payload).eq('id', editId));
                } else {
                    ({ error } = await window.sb.from('achievements').insert([payload]));
                }

                if (error) {
                    toast(error.message || "儲存失敗", 'error');
                } else {
                    toast(`成就${editId ? '更新' : '新增'}成功！`, 'success');
                    if (!editId) fireConfetti();
                    resetForm();
                    loadData();
                    refreshSessionCalendar();
                }
            } catch (e) {
                toast("網路連線失敗", 'error');
            } finally {
                btn.disabled = false;
            }
        }

        async function deleteAchievement(id, name) {
            if (!confirm(`確定要刪除成就「${name}」嗎？`)) return;
            try {
                const { error } = await window.sb.from('achievements').delete().eq('id', id);
                if (error) {
                    toast(error.message || "刪除失敗", 'error');
                } else {
                    toast("成就已刪除", 'success');
                    loadData();
                    refreshSessionCalendar();
                }
            } catch (e) {
                toast("網路連線失敗", 'error');
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await initSessionCalendar(
                'ach_date',
                new Date(),
                null,
                async () => {
                    const { data, error } = await window.sb.from('achievements').select('date');
                    if (error) throw error;
                    return data.map(a => a.date);
                }
            );
            loadData();
        });
    </script>
</body>

</html>
