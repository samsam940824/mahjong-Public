<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#6366f1">
    <link rel="manifest" href="./manifest.json">
    <title>麻將戰績 - 登入</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            color: #2c3e50;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            font-size: 1.1rem;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="utils.js"></script>
    <script src="auth.js"></script>

    <div class="login-card">
        <h2>🀄 麻將戰績登入</h2>
        <div id="msgAlert" class="alert"></div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required placeholder="admin@example.com">
            </div>

            <div class="form-group">
                <label for="password">密碼</label>
                <input type="password" id="password" required placeholder="請輸入密碼">
            </div>

            <button type="submit" id="submitBtn" class="btn btn-primary btn-login">登入</button>
        </form>
    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('submitBtn');

            btn.disabled = true;
            btn.textContent = '登入中...';

            try {
                const { data, error } = await window.sb.auth.signInWithPassword({ email, password });

                if (error) {
                    toast("登入失敗：" + error.message, 'error');
                } else if (data.session) {
                    window.location.href = 'index.html';
                }
            } catch (err) {
                toast("網路錯誤：" + err.message, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = '登入';
            }
        }
    </script>
</body>

</html>
