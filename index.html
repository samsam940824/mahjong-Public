<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>儀表板 - 麻將戰績</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="utils.js"></script>
    <script src="auth.js"></script>

    <header>
        <a href="./index.html">🀄 麻將戰績紀錄</a>
    </header>
    <nav class="nav-links">
        <a href="./index.html"     data-page="index.html">首頁</a>
        <a href="./session_new.html" data-page="session_new.html">記一場</a>
        <a href="./players.html"   data-page="players.html">玩家</a>
        <a href="./query.html"     data-page="query.html">查詢</a>
        <a href="./achievements.html" data-page="achievements.html">成就</a>
        <a href="./export.html"    data-page="export.html">匯出</a>
        <a href="#" class="nav-logout" onclick="logout(); return false;">登出</a>
    </nav>

    <div class="container">
        <div class="card">
            <h3>🏆 戰績排行榜 (Top 5)</h3>

            <div class="tab-nav">
                <div class="tab-btn active" data-tab="month">本月戰績</div>
                <div class="tab-btn"        data-tab="year">今年戰績</div>
                <div class="tab-btn"        data-tab="total">總累積</div>
            </div>

            <div id="tab-month" class="tab-content active">
                <table>
                    <thead><tr><th>玩家</th><th class="text-right">總輸贏</th></tr></thead>
                    <tbody id="month-tbody"></tbody>
                </table>
            </div>
            <div id="tab-year" class="tab-content">
                <table>
                    <thead><tr><th>玩家</th><th class="text-right">總輸贏</th></tr></thead>
                    <tbody id="year-tbody"></tbody>
                </table>
            </div>
            <div id="tab-total" class="tab-content">
                <table>
                    <thead><tr><th>玩家</th><th class="text-right">總輸贏</th></tr></thead>
                    <tbody id="total-tbody"></tbody>
                </table>
            </div>

            <div class="text-right" style="margin-top: 15px;">
                <a href="query.html" style="color: #3498db; text-decoration: none;">➔ 查看完整排行</a>
            </div>
        </div>

        <div class="card">
            <h3>🕒 近期場次</h3>
            <table>
                <thead>
                    <tr>
                        <th>日期</th>
                        <th>參與人數</th>
                        <th>備註</th>
                    </tr>
                </thead>
                <tbody id="recent-sessions-tbody"></tbody>
            </table>
            <div class="text-right" style="margin-top: 15px;">
                <a href="session_new.html" style="color: #27ae60; text-decoration: none; font-weight: bold;">➕ 記錄新戰績</a>
            </div>
        </div>
    </div>

    <script>
        // Tab switching using data attributes (no fragile index matching)
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const tabId = btn.dataset.tab;
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById('tab-' + tabId).classList.add('active');
            });
        });

        function renderStatsTable(tbodyId, dataList) {
            const tbody = document.getElementById(tbodyId);
            if (!dataList || dataList.length === 0) {
                tbody.innerHTML = '<tr><td colspan="2" class="text-center" style="padding:20px; color:#999;">目前無資料</td></tr>';
                return;
            }
            tbody.innerHTML = '';
            dataList.forEach(stat => {
                const tr = document.createElement('tr');
                const tdPlayer = document.createElement('td');
                tdPlayer.innerHTML = `${escapeHTML(stat.name)} ${stat.type === 'guest' ? '<span style="font-size:0.8em;color:#999;">(客)</span>' : ''}`;

                const tdScore = document.createElement('td');
                tdScore.className = 'text-right ' + (stat.total_score > 0 ? 'score-positive' : stat.total_score < 0 ? 'score-negative' : 'score-neutral');
                tdScore.textContent = stat.total_score;

                tr.append(tdPlayer, tdScore);
                tbody.appendChild(tr);
            });
        }

        function renderSessions(list) {
            const tbody = document.getElementById('recent-sessions-tbody');
            if (!list || list.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" class="text-center" style="padding:20px; color:#999;">目前無場次紀錄</td></tr>';
                return;
            }
            tbody.innerHTML = '';
            list.forEach(s => {
                const tr = document.createElement('tr');
                tr.style.cursor = 'pointer';
                tr.onclick = () => window.location.href = `query.html?tab=session&date=${s.date}`;
                tr.onmouseover = () => tr.style.backgroundColor = '#f9f9f9';
                tr.onmouseout  = () => tr.style.backgroundColor = '';

                const tdDate  = document.createElement('td'); tdDate.textContent  = s.date;
                const tdCount = document.createElement('td'); tdCount.textContent = s.total_players;
                const tdNote  = document.createElement('td'); tdNote.textContent  = s.note || ''; tdNote.style.color = '#888';

                tr.append(tdDate, tdCount, tdNote);
                tbody.appendChild(tr);
            });
        }

        function calculateRanking(ledgers, filterFn) {
            const scores = {};
            ledgers.forEach(l => {
                if (!filterFn(l.sessions.date)) return;
                const p = l.players;
                if (!p) return;
                if (!scores[p.id]) scores[p.id] = { name: p.name, type: p.type, total_score: 0 };
                scores[p.id].total_score += l.delta;
            });
            return Object.values(scores).sort((a, b) => b.total_score - a.total_score).slice(0, 5);
        }

        async function loadDashboard() {
            try {
                const { data: ledgers, error: lErr } = await window.sb
                    .from('ledgers')
                    .select('delta, players(id, name, type), sessions(date)');
                if (lErr) throw lErr;

                const today = new Date();
                const currentMonth = today.toISOString().slice(0, 7);
                const currentYear  = today.toISOString().slice(0, 4);

                renderStatsTable('month-tbody', calculateRanking(ledgers, d => d.startsWith(currentMonth)));
                renderStatsTable('year-tbody',  calculateRanking(ledgers, d => d.startsWith(currentYear)));
                renderStatsTable('total-tbody', calculateRanking(ledgers, () => true));

                const { data: sessions, error: sErr } = await window.sb
                    .from('sessions')
                    .select('*, ledgers(id)')
                    .order('date', { ascending: false })
                    .limit(5);
                if (sErr) throw sErr;

                renderSessions(sessions.map(s => ({ ...s, total_players: s.ledgers ? s.ledgers.length : 0 })));
            } catch (e) {
                console.error('載入儀表板失敗:', e);
            }
        }

        document.addEventListener('DOMContentLoaded', loadDashboard);
    </script>
</body>

</html>
