<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#6366f1">
    <link rel="manifest" href="./manifest.json">
    <title>儀表板 - 麻將戰績</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="utils.js"></script>
    <script src="auth.js"></script>

    <header>
        <a href="./index.html">🀄 麻將戰績紀錄</a>
    </header>
    <nav class="nav-links" aria-label="主導覽">
        <a href="./index.html"        data-page="index.html">首頁</a>
        <a href="./session_new.html"  data-page="session_new.html">記一場</a>
        <a href="./players.html"      data-page="players.html">玩家</a>
        <a href="./query.html"        data-page="query.html">查詢</a>
        <a href="./stats.html"        data-page="stats.html">📊 數據</a>
        <a href="./achievements.html" data-page="achievements.html">成就</a>
        <a href="./export.html"       data-page="export.html">匯出</a>
        <a href="#" class="nav-logout" onclick="logout(); return false;">登出</a>
    </nav>

    <div class="container">
        <div class="card">
            <h3>🏆 戰績排行榜 (Top 5)</h3>

            <div class="tab-nav" role="tablist" aria-label="戰績排行範圍">
                <div class="tab-btn active" data-tab="tab-month" aria-selected="true">本月戰績</div>
                <div class="tab-btn"        data-tab="tab-year"  aria-selected="false">今年戰績</div>
                <div class="tab-btn"        data-tab="tab-total" aria-selected="false">總累積</div>
            </div>

            <div id="tab-month" class="tab-content active" role="tabpanel">
                <table>
                    <thead><tr><th>玩家</th><th class="text-right">總輸贏</th></tr></thead>
                    <tbody id="month-tbody"></tbody>
                </table>
            </div>
            <div id="tab-year" class="tab-content" role="tabpanel">
                <table>
                    <thead><tr><th>玩家</th><th class="text-right">總輸贏</th></tr></thead>
                    <tbody id="year-tbody"></tbody>
                </table>
            </div>
            <div id="tab-total" class="tab-content" role="tabpanel">
                <table>
                    <thead><tr><th>玩家</th><th class="text-right">總輸贏</th></tr></thead>
                    <tbody id="total-tbody"></tbody>
                </table>
            </div>

            <div class="text-right" style="margin-top: 16px;">
                <a href="query.html" style="color: var(--c-primary-d); text-decoration: none; font-weight:600;">➔ 查看完整排行</a>
            </div>
        </div>

        <div class="card">
            <h3>🕒 近期場次</h3>
            <table>
                <thead>
                    <tr>
                        <th>日期</th>
                        <th>參與人數</th>
                        <th>備註</th>
                    </tr>
                </thead>
                <tbody id="recent-sessions-tbody"></tbody>
            </table>
            <div class="text-right" style="margin-top: 16px;">
                <a href="session_new.html" style="color: var(--c-success-d); text-decoration: none; font-weight: 600;">➕ 記錄新戰績</a>
            </div>
        </div>
    </div>

    <script>
        setupTabs();

        function renderSessions(list) {
            const tbody = document.getElementById('recent-sessions-tbody');
            if (!list || list.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" class="empty-state">目前無場次紀錄</td></tr>';
                return;
            }
            tbody.innerHTML = '';
            list.forEach(s => {
                const tr = document.createElement('tr');
                tr.style.cursor = 'pointer';
                tr.tabIndex = 0;
                tr.setAttribute('role', 'link');
                const go = () => window.location.href = `query.html?tab=session&date=${s.date}`;
                tr.onclick = go;
                tr.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') go();
                });

                const tdDate  = document.createElement('td'); tdDate.textContent  = s.date;
                const tdCount = document.createElement('td'); tdCount.textContent = s.total_players;
                const tdNote  = document.createElement('td'); tdNote.textContent  = s.note || ''; tdNote.style.color = 'var(--c-text-sub)';

                tr.append(tdDate, tdCount, tdNote);
                tbody.appendChild(tr);
            });
        }

        async function loadDashboard() {
            try {
                const { data: ledgers, error: lErr } = await window.sb
                    .from('ledgers')
                    .select('delta, players(id, name, type), sessions(date)');
                if (lErr) throw lErr;

                const monthRows = aggregateLeaderboard(ledgers, { range: 'month' }).slice(0, 5);
                const yearRows  = aggregateLeaderboard(ledgers, { range: 'year'  }).slice(0, 5);
                const totalRows = aggregateLeaderboard(ledgers, { range: 'all'   }).slice(0, 5);

                renderLeaderboardRows(document.getElementById('month-tbody'), monthRows);
                renderLeaderboardRows(document.getElementById('year-tbody'),  yearRows);
                renderLeaderboardRows(document.getElementById('total-tbody'), totalRows);

                const { data: sessions, error: sErr } = await window.sb
                    .from('sessions')
                    .select('*, ledgers(id)')
                    .order('date', { ascending: false })
                    .limit(5);
                if (sErr) throw sErr;

                renderSessions(sessions.map(s => ({ ...s, total_players: s.ledgers ? s.ledgers.length : 0 })));
            } catch (e) {
                console.error('載入儀表板失敗:', e);
                toast('載入儀表板失敗：' + e.message, 'error');
            }
        }

        document.addEventListener('DOMContentLoaded', loadDashboard);
    </script>
</body>

</html>
