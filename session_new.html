<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>記一場 - 麻將戰績</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <style>
        .player-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px dashed #eee;
        }

        .player-name {
            flex: 1;
            font-weight: 500;
        }

        .player-input {
            width: 100px;
            padding: 8px;
            text-align: right;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1.1rem;
        }

        .summary-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: center;
        }

        .summary-total {
            font-size: 1.5rem;
            font-weight: bold;
            color: green;
        }

        .summary-total.error {
            color: #e74c3c;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            font-size: 1.1rem;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="config.js"></script>
    <script src="utils.js"></script>
    <script src="auth.js"></script>

    <header>
        <a href="./index.html">🀄 麻將戰績紀錄</a>
    </header>
    <nav class="nav-links">
        <a href="./index.html"        data-page="index.html">首頁</a>
        <a href="./session_new.html"  data-page="session_new.html">記一場</a>
        <a href="./players.html"      data-page="players.html">玩家</a>
        <a href="./query.html"        data-page="query.html">查詢</a>
        <a href="./achievements.html" data-page="achievements.html">成就</a>
        <a href="./export.html"       data-page="export.html">匯出</a>
        <a href="#" class="nav-logout" onclick="logout(); return false;">登出</a>
    </nav>

    <div class="container-sm">
        <div id="msgAlert" class="alert"></div>

        <div class="card">
            <h3>
                📝 紀錄戰績
                <span id="statusBadge" class="badge badge-new">新增紀錄</span>
            </h3>

            <form id="recordForm" onsubmit="submitSession(event)">
                <div class="form-group">
                    <label>📅 日期（有場次的日期顯示藍點）</label>
                    <input type="text" id="sessionDate" placeholder="選擇日期..." readonly>
                </div>

                <div class="form-group">
                    <label>📝 備註 (可選，如：底台 300/100、地點)</label>
                    <input type="text" id="sessionNote" placeholder="例如：在家裡打、底台300/100">
                </div>

                <div style="margin-top:25px; margin-bottom:10px; font-weight:bold; color:#555; border-bottom:2px solid #eee; padding-bottom:5px;">
                    👥 輸入玩家輸贏 (贏填正，輸填負，沒打留空)
                </div>

                <div id="playersContainer">
                    <div class="text-center" style="padding:20px; color:#888;">載入玩家名單中...</div>
                </div>

                <div class="summary-box">
                    <div>目前加總 (必須為 0)</div>
                    <div id="totalSum" class="summary-total">0</div>
                </div>

                <button type="submit" id="submitBtn" class="btn btn-success btn-submit">🚀 儲存戰績</button>
            </form>
        </div>
    </div>

    <script>
        let currentSessionId = null;

        function updateTotal() {
            let total = 0;
            document.querySelectorAll('.player-input').forEach(input => {
                if (input.value) total += parseInt(input.value) || 0;
            });
            const el = document.getElementById('totalSum');
            el.textContent = total;
            el.className = 'summary-total' + (total !== 0 ? ' error' : '');
        }

        async function loadPlayers() {
            try {
                const { data: players, error } = await window.sb
                    .from('players').select('*').eq('active', true).order('name');
                if (error) throw error;

                const container = document.getElementById('playersContainer');
                container.innerHTML = '';

                if (!players || players.length === 0) {
                    container.innerHTML = '<div class="text-center" style="padding:20px;color:#888;">目前沒有啟用的玩家，請先前往「玩家」設定新增。</div>';
                    return;
                }

                players.forEach(p => {
                    const row = document.createElement('div');
                    row.className = 'player-row';

                    const nameDiv = document.createElement('div');
                    nameDiv.className = 'player-name';
                    nameDiv.textContent = `${p.name} (${p.type === 'fixed' ? '固定' : '訪客'})`;

                    const input = document.createElement('input');
                    input.type = 'number';
                    input.className = 'player-input';
                    input.placeholder = '0';
                    input.dataset.playerId = p.id;
                    input.addEventListener('input', updateTotal);

                    row.append(nameDiv, input);
                    container.appendChild(row);
                });

                checkSessionData();
            } catch (e) {
                console.error(e);
                document.getElementById('playersContainer').innerHTML =
                    `<div style="color:red; text-align:center;">載入玩家失敗：${escapeHTML(e.message)}</div>`;
            }
        }

        async function checkSessionData() {
            const dateVal = getCalendarDate();
            if (!dateVal) return;

            const badge     = document.getElementById('statusBadge');
            const submitBtn = document.getElementById('submitBtn');

            document.querySelectorAll('.player-input').forEach(i => i.value = '');
            document.getElementById('sessionNote').value = '';
            currentSessionId = null;

            try {
                const { data: session, error } = await window.sb
                    .from('sessions').select('*, ledgers(*)').eq('date', dateVal).maybeSingle();
                if (error) throw error;

                if (session) {
                    currentSessionId = session.id;
                    badge.className = 'badge badge-update';
                    badge.textContent = '更新紀錄';
                    submitBtn.className = 'btn btn-warning btn-submit';
                    submitBtn.textContent = '🔄 更新戰績';

                    if (session.note) document.getElementById('sessionNote').value = session.note;
                    session.ledgers?.forEach(l => {
                        const input = document.querySelector(`.player-input[data-player-id="${l.player_id}"]`);
                        if (input) input.value = l.delta;
                    });
                } else {
                    badge.className = 'badge badge-new';
                    badge.textContent = '新增紀錄';
                    submitBtn.className = 'btn btn-success btn-submit';
                    submitBtn.textContent = '🚀 儲存戰績';
                }
                updateTotal();
            } catch (e) {
                console.error("檢查日期失敗", e);
                showMessage("檢查日期失敗: " + e.message);
            }
        }

        async function submitSession(e) {
            e.preventDefault();

            const date  = getCalendarDate();
            const note  = document.getElementById('sessionNote').value || null;
            const inputs = document.querySelectorAll('.player-input');
            const ledgersData = [];
            let hasValue = false;
            let sum = 0;

            inputs.forEach(input => {
                const val = input.value.trim();
                if (val && val !== '0') hasValue = true;
                if (val) {
                    const delta = parseInt(val);
                    sum += delta;
                    ledgersData.push({ player_id: parseInt(input.dataset.playerId), delta });
                }
            });

            if (!hasValue) { showMessage("至少需要輸入一筆有效的玩家分數"); return; }
            if (sum !== 0) { showMessage("所有玩家輸贏加總必須為 0"); return; }

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;

            try {
                if (currentSessionId) {
                    const { error: sErr } = await window.sb.from('sessions').update({ note }).eq('id', currentSessionId);
                    if (sErr) throw sErr;
                    const { error: delErr } = await window.sb.from('ledgers').delete().eq('session_id', currentSessionId);
                    if (delErr) throw delErr;
                    const { error: lErr } = await window.sb.from('ledgers').insert(ledgersData.map(l => ({ ...l, session_id: currentSessionId })));
                    if (lErr) throw lErr;
                } else {
                    const { data: newSession, error: sErr } = await window.sb.from('sessions').insert([{ date, note }]).select().single();
                    if (sErr) throw sErr;
                    const { error: lErr } = await window.sb.from('ledgers').insert(ledgersData.map(l => ({ ...l, session_id: newSession.id })));
                    if (lErr) {
                        await window.sb.from('sessions').delete().eq('id', newSession.id); // rollback
                        throw lErr;
                    }
                }

                showMessage('戰績儲存成功！', true);
                if (!currentSessionId) refreshSessionCalendar(); // 新增場次：刷新日曆藍點
                checkSessionData();
            } catch (e) {
                console.error(e);
                showMessage("儲存失敗：" + e.message);
            } finally {
                btn.disabled = false;
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            // 讀 URL 參數 ?date=（從查詢頁「編輯此場紀錄」跳過來時帶的日期）
            const params     = new URLSearchParams(window.location.search);
            const dateParam  = params.get('date');
            const targetDate = dateParam || new Date().toISOString().split('T')[0];

            // 必須等日曆初始化完成（getCalendarDate() 才有值），
            // 再呼叫 loadPlayers()，否則內部的 checkSessionData() 會拿到空字串
            await initSessionCalendar('sessionDate', targetDate, checkSessionData);
            loadPlayers();
        });
    </script>
</body>

</html>
