<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#6366f1">
    <link rel="manifest" href="./manifest.json">
    <title>記一場 - 麻將戰績</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>

<body>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="config.js"></script>
    <script src="utils.js"></script>
    <script src="auth.js"></script>

    <header>
        <a href="./index.html">🀄 麻將戰績紀錄</a>
    </header>
    <nav class="nav-links" aria-label="主導覽">
        <a href="./index.html"        data-page="index.html">首頁</a>
        <a href="./session_new.html"  data-page="session_new.html">記一場</a>
        <a href="./players.html"      data-page="players.html">玩家</a>
        <a href="./query.html"        data-page="query.html">查詢</a>
        <a href="./stats.html"        data-page="stats.html">📊 數據</a>
        <a href="./achievements.html" data-page="achievements.html">成就</a>
        <a href="./export.html"       data-page="export.html">匯出</a>
        <a href="#" class="nav-logout" onclick="logout(); return false;">登出</a>
    </nav>

    <div class="container-sm">
        <div class="card" id="recordCard">
            <h3>
                📝 紀錄戰績
                <span id="statusBadge" class="badge badge-new">新增紀錄</span>
            </h3>

            <form id="recordForm" onsubmit="submitSession(event)">
                <div class="form-group">
                    <label for="sessionDate">📅 日期（有場次的日期顯示藍點）</label>
                    <input type="text" id="sessionDate" placeholder="選擇日期..." readonly>
                </div>

                <div class="form-group">
                    <label for="sessionNote">📝 備註 (可選，如：底台 300/100、地點)</label>
                    <input type="text" id="sessionNote" placeholder="例如：在家裡打、底台300/100">
                </div>

                <div style="margin-top:20px; margin-bottom:10px; font-weight:700; color:var(--c-text-sub); border-bottom:2px solid var(--c-border); padding-bottom:8px;">
                    👥 輸入玩家輸贏 (贏填正，輸填負，沒打留空)
                </div>

                <div id="playersContainer">
                    <div class="skeleton" style="height:120px;"></div>
                </div>

                <div class="summary-box">
                    <div class="text-muted" style="font-size:.85rem; margin-bottom:6px;">目前加總 (必須為 0)</div>
                    <div id="totalSum" class="summary-total ok">0</div>
                </div>

                <button type="submit" id="submitBtn" class="btn btn-success btn-block" style="padding:14px; font-size:1.05rem;">🚀 儲存戰績</button>
            </form>
        </div>
    </div>

    <script>
        let currentSessionId = null;

        function updateTotal() {
            let total = 0;
            document.querySelectorAll('.player-input').forEach(input => {
                const v = parseInt(input.value) || 0;
                if (input.value) total += v;
                input.classList.remove('input-positive', 'input-negative');
                if (v > 0) input.classList.add('input-positive');
                else if (v < 0) input.classList.add('input-negative');
            });
            const el = document.getElementById('totalSum');
            const target = total;
            const ok = total === 0;
            el.classList.toggle('error', !ok);
            el.classList.toggle('ok', ok);
            animateNumber(el, target, 200);
        }

        async function loadPlayers() {
            try {
                const { data: players, error } = await window.sb
                    .from('players').select('*').eq('active', true).order('name');
                if (error) throw error;

                const container = document.getElementById('playersContainer');
                container.innerHTML = '';

                if (!players || players.length === 0) {
                    container.innerHTML = '<div class="empty-state">目前沒有啟用的玩家，請先前往「玩家」設定新增。</div>';
                    return;
                }

                players.forEach(p => {
                    const row = document.createElement('div');
                    row.className = 'player-row';

                    const nameDiv = document.createElement('div');
                    nameDiv.className = 'player-name';
                    nameDiv.textContent = `${p.name} (${p.type === 'fixed' ? '固定' : '訪客'})`;

                    const input = document.createElement('input');
                    input.type = 'number';
                    input.className = 'player-input';
                    input.placeholder = '0';
                    input.setAttribute('aria-label', `${p.name} 分數`);
                    input.dataset.playerId = p.id;
                    input.addEventListener('input', updateTotal);

                    row.append(nameDiv, input);
                    container.appendChild(row);
                });

                checkSessionData();
            } catch (e) {
                console.error(e);
                document.getElementById('playersContainer').innerHTML =
                    `<div class="empty-state" style="color:var(--c-danger);">載入玩家失敗：${escapeHTML(e.message)}</div>`;
            }
        }

        async function checkSessionData() {
            const dateVal = getCalendarDate();
            if (!dateVal) return;

            const badge     = document.getElementById('statusBadge');
            const submitBtn = document.getElementById('submitBtn');

            document.querySelectorAll('.player-input').forEach(i => { i.value = ''; i.classList.remove('input-positive','input-negative'); });
            document.getElementById('sessionNote').value = '';
            currentSessionId = null;

            try {
                const { data: session, error } = await window.sb
                    .from('sessions').select('*, ledgers(*)').eq('date', dateVal).maybeSingle();
                if (error) throw error;

                if (session) {
                    currentSessionId = session.id;
                    badge.className = 'badge badge-update';
                    badge.textContent = '更新紀錄';
                    submitBtn.className = 'btn btn-warning btn-block';
                    submitBtn.style.cssText = 'padding:14px; font-size:1.05rem;';
                    submitBtn.textContent = '🔄 更新戰績';

                    if (session.note) document.getElementById('sessionNote').value = session.note;
                    session.ledgers?.forEach(l => {
                        const input = document.querySelector(`.player-input[data-player-id="${l.player_id}"]`);
                        if (input) input.value = l.delta;
                    });
                    toast(`此日期已有紀錄，自動切換為編輯模式`, 'info', 2500);
                } else {
                    badge.className = 'badge badge-new';
                    badge.textContent = '新增紀錄';
                    submitBtn.className = 'btn btn-success btn-block';
                    submitBtn.style.cssText = 'padding:14px; font-size:1.05rem;';
                    submitBtn.textContent = '🚀 儲存戰績';
                }
                updateTotal();
            } catch (e) {
                console.error("檢查日期失敗", e);
                toast("檢查日期失敗: " + e.message, 'error');
            }
        }

        async function submitSession(e) {
            e.preventDefault();

            const date  = getCalendarDate();
            const note  = document.getElementById('sessionNote').value || null;
            const inputs = document.querySelectorAll('.player-input');
            const ledgersData = [];
            let hasValue = false;
            let sum = 0;

            inputs.forEach(input => {
                const val = input.value.trim();
                if (val && val !== '0') hasValue = true;
                if (val) {
                    const delta = parseInt(val);
                    sum += delta;
                    ledgersData.push({ player_id: parseInt(input.dataset.playerId), delta });
                }
            });

            if (!hasValue) { toast("至少需要輸入一筆有效的玩家分數", 'warn'); return; }
            if (sum !== 0) { toast("所有玩家輸贏加總必須為 0", 'warn'); return; }

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;

            try {
                if (currentSessionId) {
                    const { error: sErr } = await window.sb.from('sessions').update({ note }).eq('id', currentSessionId);
                    if (sErr) throw sErr;
                    const { error: delErr } = await window.sb.from('ledgers').delete().eq('session_id', currentSessionId);
                    if (delErr) throw delErr;
                    const { error: lErr } = await window.sb.from('ledgers').insert(ledgersData.map(l => ({ ...l, session_id: currentSessionId })));
                    if (lErr) throw lErr;
                } else {
                    const { data: newSession, error: sErr } = await window.sb.from('sessions').insert([{ date, note }]).select().single();
                    if (sErr) throw sErr;
                    const { error: lErr } = await window.sb.from('ledgers').insert(ledgersData.map(l => ({ ...l, session_id: newSession.id })));
                    if (lErr) {
                        await window.sb.from('sessions').delete().eq('id', newSession.id);
                        throw lErr;
                    }
                }

                toast('戰績儲存成功！', 'success');
                const card = document.getElementById('recordCard');
                card.classList.remove('flash-success');
                void card.offsetWidth;
                card.classList.add('flash-success');

                if (!currentSessionId) refreshSessionCalendar();
                checkSessionData();
            } catch (e) {
                console.error(e);
                toast("儲存失敗：" + e.message, 'error');
            } finally {
                btn.disabled = false;
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const params     = new URLSearchParams(window.location.search);
            const dateParam  = params.get('date');
            const targetDate = dateParam || new Date().toISOString().split('T')[0];

            await initSessionCalendar('sessionDate', targetDate, checkSessionData);
            loadPlayers();
        });
    </script>
</body>

</html>
