name: Supabase Keepalive

on:
  schedule:
    # 09:15 Asia/Taipei every Monday and Thursday. GitHub cron uses UTC.
    - cron: "15 1 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ping Supabase REST API
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_KEEPALIVE_TABLE: ${{ vars.SUPABASE_KEEPALIVE_TABLE }}
        run: |
          set -euo pipefail

          supabase_url="${SUPABASE_URL:-}"
          supabase_key="${SUPABASE_ANON_KEY:-}"
          keepalive_table="${SUPABASE_KEEPALIVE_TABLE:-players}"

          if [[ -z "$supabase_url" ]]; then
            supabase_url="$(sed -n "s/^const SUPABASE_URL = '\(.*\)';$/\1/p" config.js)"
          fi

          if [[ -z "$supabase_key" ]]; then
            supabase_key="$(sed -n "s/^const SUPABASE_KEY = '\(.*\)';$/\1/p" config.js)"
          fi

          if [[ -z "$supabase_url" || -z "$supabase_key" ]]; then
            echo "Could not read Supabase URL or anon key from secrets or config.js."
            exit 1
          fi

          response_code="$(curl --silent --show-error --output /tmp/supabase_keepalive_response.txt --write-out "%{http_code}" \
            --get "$supabase_url/rest/v1/$keepalive_table" \
            --data-urlencode "select=id" \
            --data-urlencode "limit=1" \
            --header "apikey: $supabase_key" \
            --header "Authorization: Bearer $supabase_key")"

          if [[ "$response_code" -lt 200 || "$response_code" -ge 300 ]]; then
            echo "Supabase keepalive failed with HTTP $response_code."
            cat /tmp/supabase_keepalive_response.txt
            exit 1
          fi

          echo "Supabase keepalive OK (HTTP $response_code)."
