<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>資料匯出 - 麻將戰績</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .export-card {
            text-align: center;
            padding: 30px;
        }

        .export-card h3 {
            color: #2c3e50;
            font-size: 1.5rem;
        }

        .export-card p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn-export {
            display: inline-block;
            padding: 15px 25px;
            margin: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            transition: transform 0.2s, opacity 0.2s;
        }

        .btn-export:hover:not(:disabled) {
            transform: translateY(-2px);
        }

        .info-box {
            background-color: #e8f4f8;
            border-left: 4px solid #3498db;
            padding: 15px;
            text-align: left;
            margin-top: 30px;
            font-size: 0.9rem;
            color: #555;
            border-radius: 0 4px 4px 0;
        }
    </style>
</head>

<body>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="utils.js"></script>
    <script src="auth.js"></script>

    <header>
        <a href="./index.html">🀄 麻將戰績紀錄</a>
    </header>
    <nav class="nav-links">
        <a href="./index.html"        data-page="index.html">首頁</a>
        <a href="./session_new.html"  data-page="session_new.html">記一場</a>
        <a href="./players.html"      data-page="players.html">玩家</a>
        <a href="./query.html"        data-page="query.html">查詢</a>
        <a href="./achievements.html" data-page="achievements.html">成就</a>
        <a href="./export.html"       data-page="export.html">匯出</a>
        <a href="#" class="nav-logout" onclick="logout(); return false;">登出</a>
    </nav>

    <div class="container-sm">
        <div id="msgAlert" class="alert"></div>

        <div class="card export-card">
            <h3>📊 戰績資料匯出</h3>
            <p>您可以將戰績資料匯出為 CSV 格式，包含歷史所有場次，方便使用 Excel 等軟體進行進階分析或備份。</p>

            <div>
                <button onclick="downloadCSV('month')" id="btnMonth" class="btn btn-primary btn-export">
                    📥 下載本月 CSV
                </button>
                <button onclick="downloadCSV('all')" id="btnAll" class="btn btn-success btn-export">
                    📥 下載全部 CSV
                </button>
            </div>

            <div class="info-box">
                <strong>匯出說明：</strong>
                <ul style="margin-top:5px; padding-left:20px;">
                    <li>檔案為 <code>UTF-8 with BOM</code> 格式，Excel 開啟不會亂碼。</li>
                    <li>直欄為玩家名稱，橫列為日期，內容為該場輸贏分數。</li>
                    <li>建議定期下載以備份重要戰績紀錄。</li>
                </ul>
            </div>
        </div>
    </div>

    <script>
        // CSV 欄位值：處理含逗號、引號或換行的內容
        function csvCell(val) {
            const s = String(val == null ? '' : val);
            if (s.includes(',') || s.includes('"') || s.includes('\n')) {
                return '"' + s.replace(/"/g, '""') + '"';
            }
            return s;
        }

        async function downloadCSV(rangeType) {
            const btnMonth = document.getElementById('btnMonth');
            const btnAll   = document.getElementById('btnAll');
            btnMonth.disabled = btnAll.disabled = true;

            try {
                const { data: ledgers, error } = await window.sb
                    .from('ledgers')
                    .select('delta, players(name, type), sessions(date)')
                    .order('sessions(date)', { ascending: false });
                if (error) throw error;

                if (!ledgers || ledgers.length === 0) {
                    showMessage("目前無戰績資料可匯出！");
                    return;
                }

                const today = new Date();
                const currentMonth = today.toISOString().slice(0, 7);

                const playerNames = new Set();
                const sessionDataMap = {};

                ledgers.forEach(l => {
                    const dateStr = l.sessions.date;
                    if (rangeType === 'month' && !dateStr.startsWith(currentMonth)) return;

                    const pName = `${l.players.name}(${l.players.type === 'fixed' ? '固定' : '訪客'})`;
                    playerNames.add(pName);
                    if (!sessionDataMap[dateStr]) sessionDataMap[dateStr] = {};
                    sessionDataMap[dateStr][pName] = (sessionDataMap[dateStr][pName] || 0) + l.delta;
                });

                const sortedDates   = Object.keys(sessionDataMap).sort((a, b) => b.localeCompare(a));
                const sortedPlayers = Array.from(playerNames).sort();

                if (sortedDates.length === 0) {
                    showMessage("該區間無戰績資料可匯出！");
                    return;
                }

                let csvContent = '\uFEFF'; // UTF-8 BOM
                csvContent += ['日期', ...sortedPlayers].map(csvCell).join(',') + '\n';
                sortedDates.forEach(date => {
                    const row = [date, ...sortedPlayers.map(p => sessionDataMap[date][p] || 0)];
                    csvContent += row.map(csvCell).join(',') + '\n';
                });

                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url  = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `mahjong_records_${rangeType}.csv`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
            } catch (e) {
                console.error("匯出失敗:", e);
                showMessage("匯出失敗：" + e.message);
            } finally {
                btnMonth.disabled = btnAll.disabled = false;
            }
        }
    </script>
</body>

</html>
