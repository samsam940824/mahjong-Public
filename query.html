<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#6366f1">
    <link rel="manifest" href="./manifest.json">
    <title>統計查詢 - 麻將戰績</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>

<body>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="config.js"></script>
    <script src="utils.js"></script>
    <script src="auth.js"></script>

    <header>
        <a href="./index.html">🀄 麻將戰績紀錄</a>
    </header>
    <nav class="nav-links" aria-label="主導覽">
        <a href="./index.html"        data-page="index.html">首頁</a>
        <a href="./session_new.html"  data-page="session_new.html">記一場</a>
        <a href="./players.html"      data-page="players.html">玩家</a>
        <a href="./query.html"        data-page="query.html">查詢</a>
        <a href="./stats.html"        data-page="stats.html">📊 數據</a>
        <a href="./achievements.html" data-page="achievements.html">成就</a>
        <a href="./export.html"       data-page="export.html">匯出</a>
        <a href="#" class="nav-logout" onclick="logout(); return false;">登出</a>
    </nav>

    <div class="container">
        <div class="card">
            <div class="tab-nav" role="tablist">
                <div class="tab-btn active" data-tab="tab-stats"   aria-selected="true">戰績統計</div>
                <div class="tab-btn"        data-tab="tab-player"  aria-selected="false">玩家明細</div>
                <div class="tab-btn"        data-tab="tab-session" aria-selected="false">場次明細</div>
            </div>

            <!-- 戰績統計 -->
            <div id="tab-stats" class="tab-content active" role="tabpanel">
                <div style="display:flex; gap:10px; align-items:center; margin-bottom:16px; flex-wrap:wrap;">
                    <select id="rangeSelect" onchange="loadLeaderboard()" style="flex:1; min-width:140px; height:42px;" aria-label="範圍選擇">
                        <option value="month">本月</option>
                        <option value="year">今年</option>
                        <option value="all">全部</option>
                    </select>
                    <label style="display:flex; align-items:center; gap:8px; white-space:nowrap; cursor:pointer; padding:8px 12px; background:#fff; border-radius:var(--radius-sm); border:1.5px solid var(--c-border); height:42px; box-sizing:border-box;">
                        <input type="checkbox" id="guestCheck" onchange="loadLeaderboard()" style="width:18px; height:18px; margin:0; accent-color: var(--c-primary);" checked>
                        <span style="font-size:.95rem; line-height:1;">含訪客</span>
                    </label>
                </div>
                <table id="leaderboardTable">
                    <thead><tr><th>玩家</th><th class="text-right">總輸贏</th></tr></thead>
                    <tbody id="leaderboardTbody"></tbody>
                </table>
                <p id="guestNote" class="text-muted" style="margin-top:10px; display:none;">* 已排除訪客。</p>
            </div>

            <!-- 玩家明細 -->
            <div id="tab-player" class="tab-content" role="tabpanel">
                <div class="form-group">
                    <label for="player-select">選擇玩家</label>
                    <select id="player-select" onchange="loadPlayerHistory()">
                        <option value="">-- 請選擇玩家 --</option>
                    </select>
                </div>
                <div id="player-history-result"></div>
            </div>

            <!-- 場次明細 -->
            <div id="tab-session" class="tab-content" role="tabpanel">
                <div class="form-group">
                    <label for="session-date-picker">📅 選擇日期（有場次的日期下方有藍點）</label>
                    <input type="text" id="session-date-picker" placeholder="選擇日期..." readonly>
                </div>
                <div id="session-detail-result"></div>
            </div>
        </div>
    </div>

    <script>
        setupTabs(document, (tabId) => {
            if (tabId === 'tab-session') {
                const result = document.getElementById('session-detail-result');
                if (!result.innerHTML.trim()) loadSessionDetail();
            }
        });

        function switchTab(tabId) {
            const btn = document.querySelector(`.tab-btn[data-tab="${tabId}"]`);
            if (btn) btn.click();
        }

        async function loadLeaderboard() {
            const range         = document.getElementById('rangeSelect').value;
            const includeGuests = document.getElementById('guestCheck').checked;
            document.getElementById('guestNote').style.display = includeGuests ? 'none' : 'block';

            try {
                const { data: ledgers, error } = await window.sb
                    .from('ledgers').select('delta, players(id, name, type), sessions(date)');
                if (error) throw error;

                const rows = aggregateLeaderboard(ledgers, { range, includeGuests });
                renderLeaderboardRows(document.getElementById('leaderboardTbody'), rows);
            } catch (e) {
                console.error("載入排行榜失敗:", e);
                toast("載入排行榜失敗：" + e.message, 'error');
            }
        }

        async function loadPlayerOptions() {
            try {
                const { data: players, error } = await window.sb.from('players').select('*').order('name');
                if (error) throw error;
                const select = document.getElementById('player-select');
                players.forEach(p => {
                    const opt = document.createElement('option');
                    opt.value = p.id;
                    opt.textContent = `${p.name} (${p.type === 'fixed' ? '固定' : '訪客'})`;
                    select.appendChild(opt);
                });
            } catch (e) { console.error("無法載入玩家下拉選單", e); }
        }

        async function loadPlayerHistory() {
            const pid = document.getElementById('player-select').value;
            const resultDiv = document.getElementById('player-history-result');
            if (!pid) { resultDiv.innerHTML = ''; return; }

            resultDiv.innerHTML = '<div class="skeleton" style="height:160px;"></div>';
            try {
                const { data: history, error } = await window.sb
                    .from('ledgers').select('delta, sessions(date, note)').eq('player_id', pid);
                if (error) throw error;

                if (!history || history.length === 0) {
                    resultDiv.innerHTML = "<p class='empty-state'>尚無紀錄</p>";
                    return;
                }

                history.sort((a, b) => b.sessions.date.localeCompare(a.sessions.date));

                const total = history.reduce((s, r) => s + r.delta, 0);
                const wins  = history.filter(r => r.delta > 0).length;
                const losses = history.filter(r => r.delta < 0).length;
                const high  = Math.max(...history.map(r => r.delta));
                const low   = Math.min(...history.map(r => r.delta));

                let html = `
                <div class="stat-grid">
                    <div class="stat-card"><div class="stat-label">總輸贏</div><div class="stat-value ${total>0?'score-positive':total<0?'score-negative':''}">${total>0?'+':''}${total}</div></div>
                    <div class="stat-card"><div class="stat-label">場次</div><div class="stat-value">${history.length}</div></div>
                    <div class="stat-card"><div class="stat-label">勝/負</div><div class="stat-value" style="font-size:1.1rem;">${wins} / ${losses}</div></div>
                    <div class="stat-card"><div class="stat-label">最高 / 最低</div><div class="stat-value" style="font-size:1.05rem;"><span class="score-positive">+${high}</span> / <span class="score-negative">${low}</span></div></div>
                </div>
                <table>
                    <thead><tr><th>日期</th><th class="text-right">輸贏</th></tr></thead>
                    <tbody>`;
                history.forEach(row => {
                    const cls = row.delta > 0 ? 'score-positive' : row.delta < 0 ? 'score-negative' : 'score-neutral';
                    html += `<tr>
                        <td>${escapeHTML(row.sessions.date)}${row.sessions.note ? `<br><span class="text-muted">${escapeHTML(row.sessions.note)}</span>` : ''}</td>
                        <td class="text-right ${cls}">${row.delta>0?'+':''}${row.delta}</td>
                    </tr>`;
                });
                html += '</tbody></table>';
                resultDiv.innerHTML = html;
            } catch (e) {
                console.error(e);
                resultDiv.innerHTML = '<p class="empty-state" style="color:var(--c-danger);">載入失敗</p>';
            }
        }

        async function loadSessionDetail() {
            const dateVal   = getCalendarDate();
            const resultDiv = document.getElementById('session-detail-result');
            if (!dateVal) return;

            resultDiv.innerHTML = '<div class="skeleton" style="height:120px;"></div>';
            try {
                const { data: session, error } = await window.sb
                    .from('sessions').select('id, date, note, ledgers(delta, players(name, type))').eq('date', dateVal).maybeSingle();
                if (error) throw error;

                if (!session) {
                    resultDiv.innerHTML = "<p class='empty-state'>該日無戰績紀錄</p>";
                    return;
                }

                let html = `<table>
                    <thead><tr><th>玩家</th><th class="text-right">輸贏</th></tr></thead>
                    <tbody>`;
                session.ledgers.forEach(row => {
                    const cls     = row.delta > 0 ? 'score-positive' : row.delta < 0 ? 'score-negative' : 'score-neutral';
                    const typeStr = row.players.type === 'fixed' ? '固定' : '訪客';
                    html += `<tr>
                        <td>${escapeHTML(row.players.name)} <span class="text-muted">(${typeStr})</span></td>
                        <td class="text-right ${cls}">${row.delta>0?'+':''}${row.delta}</td>
                    </tr>`;
                });
                html += `</tbody></table>
                ${session.note ? `<p class="text-muted" style="margin-top:12px;">📝 ${escapeHTML(session.note)}</p>` : ''}
                <div style="display:flex; gap:10px; margin-top:18px; justify-content:flex-end; flex-wrap:wrap;">
                    <a href="session_new.html?date=${dateVal}" class="btn btn-secondary" style="text-decoration:none;">✏️ 編輯</a>
                    <button onclick="deleteSession(${session.id})" class="btn btn-danger">🗑️ 刪除此場</button>
                </div>`;
                resultDiv.innerHTML = html;
            } catch (e) {
                resultDiv.innerHTML = '<p class="empty-state" style="color:var(--c-danger);">載入失敗</p>';
            }
        }

        async function deleteSession(sessionId) {
            if (!confirm('確定要刪除這場戰績嗎？')) return;
            try {
                const { error } = await window.sb.from('sessions').delete().eq('id', sessionId);
                if (error) throw error;
                toast('刪除成功', 'success');
                document.getElementById('session-detail-result').innerHTML = '';
                refreshSessionCalendar();
            } catch (e) {
                console.error(e);
                toast('刪除失敗：' + e.message, 'error');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const today  = new Date().toISOString().split('T')[0];
            const params = new URLSearchParams(window.location.search);
            const tabParam  = params.get('tab');
            const dateParam = params.get('date');

            loadLeaderboard();
            loadPlayerOptions();

            const targetDate = (tabParam === 'session' && dateParam) ? dateParam : today;
            initSessionCalendar('session-date-picker', targetDate, loadSessionDetail).then(() => {
                if (tabParam === 'session') {
                    switchTab('tab-session');
                    loadSessionDetail();
                } else if (tabParam === 'player') {
                    switchTab('tab-player');
                }
            });
        });
    </script>
</body>

</html>
